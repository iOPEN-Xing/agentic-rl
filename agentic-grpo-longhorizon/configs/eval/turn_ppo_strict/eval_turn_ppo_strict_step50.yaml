env:
  name: airline
  user_strategy: llm
  user_model: "/data/xjz/model/qwen3-14b"
  user_provider: openai
  user_base_url: "http://localhost:8001/v1"
  task_split: test

policy:
  model_name: "agentic-rl-policy"
  base_url: "http://localhost:8000/v1"
  temperature: 0.7
  top_p: 0.9
  max_tokens: 4096

eval:
  num_tasks: 50
  num_samples_per_task: 4
  max_turns: 30
  num_workers: 2

output:
  dir: "experiments/turn_ppo_strict/eval_step_50"
