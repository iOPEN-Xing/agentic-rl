# PRM-Lite + DAPO: PRM-Lite v6.1 reward with DAPO Dynamic Sampling
#
# 在 PRM-Lite v6.1 基础上启用 DAPO Dynamic Sampling：
#   - 过滤 silent groups（std=0 的 prompt 组），确保每批都有有效梯度
#   - 解决 n=8 小 group size + 二值 outcome 造成的 reward 跳变问题
#
# 与 prm_lite.yaml 的区别：
#   algorithm.filter_groups.enable: True  ← 启用 DAPO
#   algorithm.filter_groups.metric: seq_final_reward  ← 基于 PRM-Lite 奖励过滤
#   actor_rollout_ref.actor.clip_ratio_low/high  ← DAPO Clip-Higher
#   actor_rollout_ref.actor.loss_agg_mode  ← DAPO Token-Level Loss
#
# 核心原理：
#   当 n=8 个样本中全部成功(score=1)或全部失败(score=0)时，std=0 → advantage=0 → 无梯度更新
#   Dynamic Sampling 过滤这些 "silent groups"，重新采样直到有 variance
#
# 预期效果：
#   - reward 曲线更平稳，减少 ±3~8σ 跳变
#   - 训练效率提升（每步都有有效梯度）
#   - 可能需要更多采样时间（max_num_gen_batches=10 限制）

hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: experiments/vanilla/train.parquet
  val_files: experiments/vanilla/val.parquet
  train_batch_size: 4
  max_prompt_length: 8192
  max_response_length: 12288
  return_raw_chat: True
  tool_config_path: configs/tool_config/tau_bench_airline_tools.yaml

actor_rollout_ref:
  model:
    path: /data/xjz/model/qwen3-8b
    enable_gradient_checkpointing: true
    lora_rank: 16
    lora_alpha: 32
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch
    override_config:
      attn_implementation: flash_attention_2
  actor:
    fsdp_config:
      optimizer_offload: true
      param_offload: true
      model_dtype: bf16
    optim:
      lr: 5.0e-6
    use_kl_loss: True
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    use_fused_kernels: true
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    # ── DAPO: Clip-Higher ───────────────────────────────────────────────────────
    # v5 原始 clip_ratio=0.2（对称裁剪）
    # DAPO 推荐: ε_low < ε_high（如 0.2 和 0.28），防止熵崩溃
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    # ── DAPO: Token-Level Loss ──────────────────────────────────────────────────
    # "token-mean": 所有 token 等权平均（防长序列梯度稀释）
    # "seq-mean-token-sum": 序列平均 → token 求和
    # "seq-mean-token-mean": 序列平均 → token 平均
    loss_agg_mode: token-mean
  rollout:
    name: "vllm"
    mode: async
    agent:
      default_agent_loop: tool_agent
    multi_turn:
      enable: True
      format: "hermes"
      max_user_turns: 15
      max_assistant_turns: 15
      tool_config_path: configs/tool_config/tau_bench_airline_tools.yaml
      interaction_config_path: configs/interaction_config/tau_bench_airline_prm_lite.yaml
    n: 8
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 4
    calculate_log_probs: true
    gpu_memory_utilization: 0.45
    load_format: safetensors
    layered_summon: true
    free_cache_engine: true
    max_num_seqs: 10
    max_model_len: 24576
    max_num_batched_tokens: 24576
    log_prob_micro_batch_size_per_gpu: 1
    val_kwargs:
      n: 1
      temperature: 0.7
      top_p: 0.9
  ref:
    fsdp_config:
      optimizer_offload: true
      param_offload: true
      use_fused_kernels: true
      model_dtype: bf16
    model:
      path: /data/xjz/model/qwen3-8b
      override_config:
        attn_implementation: flash_attention_2
    log_prob_micro_batch_size_per_gpu: 1

algorithm:
  adv_estimator: grpo
  # ── DAPO: Dynamic Sampling ─────────────────────────────────────────────────────
  # 过滤 silent groups：std=0 的 prompt 组（全部成功或全部失败）会被丢弃
  # 直到有足够的多样化组（train_batch_size 个 prompt）才进入训练
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: True
    # seq_final_reward = sum(token_level_rewards)，即 PRM-Lite 的 outcome + 0.3*process
    # 当同 prompt 的 8 个样本全为 1.0（全成功）或全 < 0.5（全失败）时，std=0 → 过滤
    metric: seq_final_reward
    # 最多重采样 10 批。如果 10 批后仍不够 train_batch_size，抛出错误
    # （正常情况不应触发，除非任务过难或 n 过小）
    max_num_gen_batches: 10
  kl_ctrl:
    kl_coef: 0.01
  rollout_correction:
    bypass_mode: true

trainer:
  total_epochs: 50
  total_training_steps: 300
  save_freq: 50
  test_freq: 50
  default_local_dir: experiments/prm_lite_dapo/checkpoints
  logger: ['console', 'wandb']
  project_name: agentic-grpo-longhorizon
  experiment_name: prm_lite_dapo_300step
  n_gpus_per_node: 4
  nnodes: 1
