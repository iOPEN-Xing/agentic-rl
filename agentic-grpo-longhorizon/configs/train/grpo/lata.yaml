# Exp 2: legacy LATA — position-weighted, length-damped GRPO (300 step)
# 实际实现: 绝对 token 位置指数权重（均值归一为 1）后，再乘 1/sqrt(L)。
# 默认 actor 仍使用 token-mean reducer，因此这不是用 sqrt(L) 替换 L，
# 也不是基于 assistant/tool 边界的真实 turn-level credit assignment。
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: experiments/vanilla/train.parquet
  val_files: experiments/vanilla/val.parquet
  train_batch_size: 4
  max_prompt_length: 8192
  max_response_length: 12288
  return_raw_chat: True
  tool_config_path: configs/tool_config/tau_bench_airline_tools.yaml

actor_rollout_ref:
  model:
    path: /data/xjz/model/qwen3-8b
    enable_gradient_checkpointing: true
    lora_rank: 16
    lora_alpha: 32
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch
    override_config:
      attn_implementation: flash_attention_2
  actor:
    fsdp_config:
      optimizer_offload: true
      param_offload: true
      model_dtype: bf16
    optim:
      lr: 5.0e-6
    use_kl_loss: True
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    use_fused_kernels: true
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
  rollout:
    name: "vllm"
    mode: async
    agent:
      default_agent_loop: tool_agent
    multi_turn:
      enable: True
      format: "hermes"
      max_user_turns: 15
      max_assistant_turns: 15
      tool_config_path: configs/tool_config/tau_bench_airline_tools.yaml
      interaction_config_path: configs/interaction_config/tau_bench_airline.yaml
    n: 8
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 4
    calculate_log_probs: true
    gpu_memory_utilization: 0.45
    load_format: safetensors
    layered_summon: true
    free_cache_engine: true
    max_num_seqs: 8
    max_model_len: 24576
    max_num_batched_tokens: 24576
    log_prob_micro_batch_size_per_gpu: 1
    val_kwargs:
      n: 1
      temperature: 0.7
      top_p: 0.9
  ref:
    fsdp_config:
      optimizer_offload: true
      param_offload: true
      use_fused_kernels: true
      model_dtype: bf16
    model:
      path: /data/xjz/model/qwen3-8b
      override_config:
        attn_implementation: flash_attention_2
    log_prob_micro_batch_size_per_gpu: 1

algorithm:
  adv_estimator: grpo_lata
  kl_ctrl:
    kl_coef: 0.01
  rollout_correction:
    bypass_mode: true
  turn_discount:
    enable: true
    alpha: 1.05

trainer:
  total_epochs: 50
  total_training_steps: 300
  save_freq: 50
  test_freq: 50
  default_local_dir: experiments/lata/checkpoints
  logger: ['console', 'wandb']
  project_name: agentic-grpo-longhorizon
  experiment_name: lata_300step
  n_gpus_per_node: 4
  nnodes: 1
